    :root {
      --bg: #eef4ef;
      --panel: #ffffff;
      --ink: #1b2a21;
      --muted: #607067;
      --line: #d7e2d9;
      --brand: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Outfit, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(34, 197, 94, 0.14), transparent 28%),
        linear-gradient(180deg, #f5faf3 0%, #edf5ef 100%);
    }

    .panel {
      width: min(400px, 100%);
      padding: 32px 28px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 18px 45px rgba(22, 38, 29, 0.08);
      text-align: center;
    }

    .panel-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: rgba(22, 101, 52, 0.1);
    }

    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid rgba(22, 101, 52, 0.18);
      border-top-color: var(--brand);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .panel-icon svg {
      width: 22px;
      height: 22px;
    }

    .panel.is-error .panel-icon {
      background: rgba(220, 38, 38, 0.1);

    a:focus-visible,
    #open-original-link:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
      border-radius: 4px;
    }

    body.pdf-ready {

      display: none;
      position: fixed;
      inset: 0;

    body.pdf-ready #viewer-frame {

    }

      box-shadow: 0 14px 28px rgba(22, 101, 52, 0.32);

<body>
  <main class="panel" id="panel">
    <div class="panel-icon" id="panel-icon"><div class="spinner" role="status" aria-label="Loading"></div></div>
    <h1 id="title">Opening prescription</h1>
    <p id="message">Please wait while we open the prescription.</p>
  </main>
  <iframe id="viewer-frame" title="Prescription PDF"></iframe>
  <a id="open-original-link" href="#" target="_blank" rel="noopener noreferrer">Open original PDF</a>

  <script type="module">
    // No Firebase import: this page is public. /api/kid/prescriptions/<id>
    // resolves the PDF under admin credentials and returns only a URL, so the
    // link never carries database access with it.
    const CLINIC_FIREBASE_NAMESPACE = 'clinics/kid';
    const FIREBASE_COLLECTIONS = {
      patients: `${CLINIC_FIREBASE_NAMESPACE}/patients`,
      pendingPatients: `${CLINIC_FIREBASE_NAMESPACE}/pendingPatients`,
      history: `${CLINIC_FIREBASE_NAMESPACE}/history`,
      prescription: `${CLINIC_FIREBASE_NAMESPACE}/prescription`
    };
    const CLINIC_STORAGE_PREFIX = CLINIC_FIREBASE_NAMESPACE;

    const panel = document.getElementById('panel');
    const panelIcon = document.getElementById('panel-icon');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const viewerFrame = document.getElementById('viewer-frame');
    const openOriginalLink = document.getElementById('open-original-link');
    const params = new URLSearchParams(window.location.search);
    const prescriptionId = (params.get('i') || '').trim();

    function showError(titleText, messageText) {
      panel.classList.add('is-error');
      panelIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
      title.textContent = titleText;
      message.textContent = messageText;
    }

    function getPdfViewerUrl(pdfUrl) {
      return pdfUrl ? `pdf-viewer.html?url=${encodeURIComponent(pdfUrl)}&embed=1` : '';
    }

    function isPublicPdfUrl(value) {
      return /^(https?:|blob:|data:)/i.test(String(value || '').trim());
    }

    function normalizeStoragePath(value) {
      const rawValue = String(value || '').trim();
      if (!rawValue || isPublicPdfUrl(rawValue)) {
        return '';
      }

      try {
        return decodeURIComponent(rawValue).replace(/^\/+/, '');
      } catch {
        return rawValue.replace(/^\/+/, '');
      }
    }

    async function openPrescription() {
      if (!prescriptionId) {
        showError('Prescription not found', 'This prescription link is missing an ID.');
        return;
      }

      try {
        const response = await fetch(`/api/kid/prescriptions/${encodeURIComponent(prescriptionId)}`);
        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          showError('Prescription not found', result.error || 'No saved prescription was found for this link.');
          return;
        }

        const pdfUrl = result.pdfUrl;
        if (!pdfUrl) {
          showError('Prescription not available', 'This prescription record does not have a PDF link.');
          return;
        }

        // Render the PDF inside this same page (rather than redirecting to
        // pdf-viewer.html/the raw file) so the link the parent opened stays
        // on /emr/kid/rx the whole time, and every page of the prescription
        // renders full-screen instead of just the first.
        const viewerUrl = getPdfViewerUrl(pdfUrl);
        message.innerHTML = `Loading prescription PDF. If it does not appear, <a href="${pdfUrl}" target="_blank" rel="noopener noreferrer">tap here</a>.`;
        openOriginalLink.href = pdfUrl;
        viewerFrame.src = viewerUrl;
        viewerFrame.addEventListener('load', () => {
          document.body.classList.add('pdf-ready');
        }, { once: true });
      } catch (error) {
        showError('Unable to open prescription', error.message || 'Something went wrong while opening the prescription.');
      }
    }

    openPrescription();
  </script>
</body>
